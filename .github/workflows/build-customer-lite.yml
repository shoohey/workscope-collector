name: Build Customer EXE (Lite / Google Drive)

# v1.1-lite（一般企業向け: スクショ無し・JSONLのみ・Google Drive直送・リモート制御）の
# 顧客別EXEを windows-latest ランナーでビルドする。Windows実機が無くても（Mac だけでも）
# このワークフローを workflow_dispatch でトリガーすれば EXE が作れる。
#
# 事前準備（Mac から1回）:
#   その顧客の OAuth 資格情報 JSON（scripts/issue_refresh_token.py で発行した
#   refresh_token/client_id/client_secret を含む oauth-tribe-XXX.json）を、
#   リポジトリ Secret `GDRIVE_OAUTH_CREDENTIALS_JSON` に登録する:
#     gh secret set GDRIVE_OAUTH_CREDENTIALS_JSON \
#       --repo shoohey/workscope-collector < /path/to/oauth-tribe-001.json
#   ※ refresh_token を input ではなく Secret で渡すことで、実行ログ・UIに残さない。
#
# トリガー（Mac から）:
#   gh workflow run build-customer-lite.yml --repo shoohey/workscope-collector \
#     -f customer="顧客名" -f customer_id="tribe-001" -f gdrive_folder_id="<DriveフォルダID>"
#   gh run watch --repo shoohey/workscope-collector
#   gh run download <run-id> --repo shoohey/workscope-collector   # EXE をDL

on:
  workflow_dispatch:
    inputs:
      customer:
        description: '顧客名 (例: テスト顧客)'
        required: true
        type: string
      customer_id:
        description: '顧客ID (例: tribe-001)。control.json / GDriveパス分離に使用'
        required: true
        type: string
      gdrive_folder_id:
        description: 'Google Drive 顧客フォルダID (URLの /folders/{ID})'
        required: true
        type: string
      industry:
        description: '業界プロファイル (lite はマスキング不要なので通常 generic)'
        required: false
        default: generic
        type: choice
        options:
          - generic
          - pharmacy
          - accounting
          - legal
          - sales
          - hr
          - construction
          - manufacturing
          - care_welfare
          - medical_dental
          - real_estate

jobs:
  build:
    name: Build ${{ inputs.customer }} (lite / ${{ inputs.customer_id }})
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lite build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt

      - name: Guard — OAuth credentials secret is set
        shell: bash
        env:
          OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_CREDENTIALS_JSON }}
        run: |
          if [ -z "$OAUTH_JSON" ]; then
            echo "::error::Secret GDRIVE_OAUTH_CREDENTIALS_JSON が未設定です。"
            echo "  Mac から次を実行してこの顧客の OAuth 資格情報 JSON を登録してください:"
            echo "    gh secret set GDRIVE_OAUTH_CREDENTIALS_JSON --repo shoohey/workscope-collector < oauth-${{ inputs.customer_id }}.json"
            exit 1
          fi

      - name: Materialize OAuth credentials (from secret, not logged)
        shell: bash
        env:
          OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_CREDENTIALS_JSON }}
        run: |
          # Secret は GitHub がログ上でマスクする。ファイルへ書き出して --oauth-credentials に渡す。
          printf '%s' "$OAUTH_JSON" > oauth-creds.json
          # 形式の軽い健全性チェック（鍵の値はechoしない）
          python -c "import json,sys; d=json.load(open('oauth-creds.json')); \
            req=['refresh_token','client_id','client_secret']; \
            miss=[k for k in req if not d.get(k)]; \
            sys.exit('ERROR: oauth json missing keys: %s' % miss) if miss else print('oauth json OK (keys present)')"

      - name: Build lite customer EXE
        shell: bash
        run: |
          chmod +x scripts/build_for_customer.sh
          ./scripts/build_for_customer.sh \
            --mode lite \
            --customer "${{ inputs.customer }}" \
            --customer-id "${{ inputs.customer_id }}" \
            --industry "${{ inputs.industry }}" \
            --gdrive-folder-id "${{ inputs.gdrive_folder_id }}" \
            --oauth-credentials "oauth-creds.json" \
            --output "dist/WorkScope_${{ inputs.customer_id }}_$(date +%Y%m%d).exe"

      - name: Verify built EXE
        shell: bash
        run: |
          ls -la dist/
          if ! ls dist/WorkScope_*.exe >/dev/null 2>&1; then
            echo "::error::built EXE not found"
            exit 1
          fi

      - name: Smoke test EXE (start → exit)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/WorkScope_*.exe | Select-Object -First 1
          Write-Host "Smoke testing: $($exe.FullName)"
          $proc = Start-Process -FilePath $exe.FullName -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force
            Write-Host "Smoke test PASS: process started and stopped cleanly"
          } else {
            Write-Host "WARN: process exited immediately with code $($proc.ExitCode)"
            exit 0
          }

      - name: Upload customer build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkScope_${{ inputs.customer_id }}_lite
          path: dist/WorkScope_*.exe
          retention-days: 30

      - name: Cleanup OAuth credentials file
        if: always()
        shell: bash
        run: rm -f oauth-creds.json
